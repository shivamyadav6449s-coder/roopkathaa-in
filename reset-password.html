<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Roopkathaa.in</title>

    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="auth.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Tiro+Devanagari+Hindi:ital@0;1&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-body">

<div class="auth-wrap">

    <div class="auth-brand">
        <a href="/" class="logo" aria-label="Roopkathaa.in — home"><img src="images/logo.png" alt="Roopkathaa.in" class="brand-logo-img"></a>
        <p class="auth-tagline">Every Outfit Tells Your Story</p>
    </div>

    <div class="auth-card">

        <form class="auth-form active" id="resetForm" novalidate>
            <h2>Set a New Password</h2>
            <p class="auth-alert" id="resetAlert" hidden></p>

            <div class="form-field">
                <label for="newPassword">New Password</label>
                <div class="password-input">
                    <input type="password" id="newPassword" name="newPassword" autocomplete="new-password">
                    <button type="button" class="toggle-pw" data-target="newPassword">Show</button>
                </div>
                <span class="field-hint">At least 8 characters, with a letter and a number</span>
                <span class="field-error" id="newPasswordError"></span>
            </div>

            <div class="form-field">
                <label for="confirmNewPassword">Confirm New Password</label>
                <div class="password-input">
                    <input type="password" id="confirmNewPassword" name="confirmNewPassword" autocomplete="new-password">
                    <button type="button" class="toggle-pw" data-target="confirmNewPassword">Show</button>
                </div>
                <span class="field-error" id="confirmNewPasswordError"></span>
            </div>

            <button type="submit" class="btn auth-submit" id="resetSubmitBtn">RESET PASSWORD</button>

            <p class="auth-switch"><a href="/login.html">Back to Login</a></p>
        </form>

    </div>
</div>

<script src="auth.js"></script>
</body>
</html>
